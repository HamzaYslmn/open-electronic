name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you redeploy by hand from the Actions tab without pushing.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A newer push supersedes an in-flight one rather
# than racing it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Do not publish a broken build: the engine tests are the safety net for
      # every formula on the site.
      - run: pnpm test

      - run: pnpm build

      - name: Add SPA fallback and disable Jekyll
        run: |
          # Pages serves static files only, so a deep link like /sim/rc-filter
          # would 404 on refresh. Serving index.html as the 404 page hands the
          # route back to the client-side router.
          cp dist/index.html dist/404.html
          # Without this, Pages runs Jekyll and drops files starting with "_".
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          # Relative to the repository root, not to working-directory.
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
